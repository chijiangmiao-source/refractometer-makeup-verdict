services:
  api:
    build: .
    # 宿主端口由环境变量 API_PORT 覆盖（未设置时默认 8000）
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 10

  # 一次性验收服务：启动 api 后跑黑盒 HTTP 验收，结束即退出
  verify:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      BASE_URL: http://api:8000
    entrypoint: ["python", "-m", "pytest", "tests/test_acceptance_http.py", "-v"]
    restart: "no"
